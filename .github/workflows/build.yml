name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: |
          chmod +x ./gradlew || true
          if [ -x ./gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        run: |
          set -e
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/SoundCompass-debug.apk
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundCompass-debug-apk
          path: out/SoundCompass-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest out/SoundCompass-debug.apk --clobber
          else
            gh release create latest out/SoundCompass-debug.apk \
              --title "SoundCompass 最新构建" \
              --notes "自动构建 #${{ github.run_number }}" \
              --latest
          fi
